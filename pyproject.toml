[project]
name = "quel3-tool"
version = "0.1.0"
description = "CLI tools for working with QuEL-3 state through quelware-client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "quelware-client>=0.3.0",
    "numpy",
    "rich",
    "tomli; python_version < '3.11'",
]

[project.scripts]
quel3-tool = "quel3_tool.cli:main"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[tool.setuptools.package-data]
quel3_tool = ["py.typed"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
